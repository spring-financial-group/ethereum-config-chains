jwt: 0xfad2709d0bb03bf0e8ba3c99bea194575d3e98863133d1af638ed056d1d59345

replicas: 1

resources:
  requests:
    cpu: "3"
    memory: "4Gi"
  limits:
    cpu: "3"
    memory: "4Gi"

ingress:
  enabled: true
  className: nginx          # or your ingressClassName (e.g. traefik)
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: rpc-geth-node.mqube-playground.com
      paths:
        - path: /
          pathType: Prefix


  tls:
    - hosts:
        - rpc-geth-node.mqube-playground.com
        - ws-geth-node.mqube-playground.com
      secretName: tls-mqube-playground-com-p


extraArgs:

  - --syncmode=full
  - --snapshot=false 
  - --gcmode=archive
  - --txlookuplimit=0  

  - --nodiscover
  - --maxpeers=0

  - --http.api=eth,net,web3,txpool,engine,admin,debug
  - --ws.api=eth,net,web3,txpool,engine,admin,debug

  - --cache=1024        # 1Gi cache helps EL build/execute payloads quickly
  - --cache.trie=50
  - --cache.trie.journal=50
  - --cache.gc=50

  - --http
  - --http.addr=0.0.0.0
  - --http.port=8545
  - --http.vhosts=*
  - --http.corsdomain=*

  - --ws
  - --ws.addr=0.0.0.0
  - --ws.port=8545
  - --ws.origins=*

  - --bootnodes=enode://f8a46a896e11e4b08c7270bdedc7376f0fb2ccff0c27665e72efcb7160b7f94cb153d8ed8cc574afcd550d83fd2c3337be64c1f159ce07e620da2f1766695a43@bootnode.devnet.svc.cluster.local:30301


devnet:
  enabled: true


  baseUrl: "https://raw.githubusercontent.com/spring-financial-group/ethereum-config-chains/main/network-configs"
  name: "private-net"

