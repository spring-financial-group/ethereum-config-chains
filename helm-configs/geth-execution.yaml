jwt: 0xfad2709d0bb03bf0e8ba3c99bea194575d3e98863133d1af638ed056d1d59345

replicas: 1

resources:
  requests:
    cpu: "3"
    memory: "4Gi"
  limits:
    cpu: "3"
    memory: "4Gi"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "6060"
  prometheus.io/path: "/debug/metrics/prometheus"

ingress:
  enabled: true
  className: nginx          # or your ingressClassName (e.g. traefik)
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: rpc-geth-node.mqube-playground.com
      paths:
        - path: /
          pathType: Prefix

  tls:
    - hosts:
        - rpc-geth-node.mqube-playground.com
        - ws-geth-node.mqube-playground.com
      secretName: tls-mqube-playground-com-p


extraArgs:

  - --syncmode=full
  - --snapshot=false 
  - --gcmode=archive
  - --txlookuplimit=0

  - --discovery.port=30303
  - --maxpeers=50

  - --http.api=eth,net,web3,txpool,engine,admin,debug
  - --ws.api=eth,net,web3,txpool,engine,admin,debug

  - --cache=1024        # 1Gi cache helps EL build/execute payloads quickly
  - --cache.trie=50
  - --cache.trie.journal=50
  - --cache.gc=50

  - --http
  - --http.addr=0.0.0.0
  - --http.port=8545
  - --http.vhosts=*
  - --http.corsdomain=*

  - --ws
  - --ws.addr=0.0.0.0
  - --ws.port=8545
  - --ws.origins=*

  - --bootnodes=enode://27dd176d350664e01704d2bd03b3a4538b7f77517932ef40d46e54d69ab09214253812695ef7245d4d06eab344db39a6b62884b7b90a6664e6aef29ae17755cf@10.0.255.77:0?discport=30301



devnet:
  enabled: true


