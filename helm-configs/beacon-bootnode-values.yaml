mode: "bootnode"

initCharts:
  - url: https://github.com/spring-financial-group/ethereum-config-chains
    path: network-configs/private-net
    configName: devnet

devnet:
  enabled: true
  baseUrl: "https://raw.githubusercontent.com/spring-financial-group/ethereum-config-chains/main/network-configs"
  name: "private-net"

p2pPort: 9000

p2pNodePort:
  enabled: false

extraArgs:
  - --enr-address=10.0.43.50  # Keep this! It tells bootnode what to advertise
  - --testnet-dir=/data/testnet_spec

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# CRITICAL: Lock service to match enr-address
service:
  enabled: true
  type: ClusterIP
  clusterIP: 10.0.43.50  # This makes service IP match advertised IP
  ports:
    - name: p2p-tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: p2p-udp
      port: 9000
      targetPort: 9000
      protocol: UDP