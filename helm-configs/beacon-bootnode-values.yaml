# beacon-bootnode-values.yaml
mode: "bootnode"

# Use the same genesis config
initCharts:
  - url: https://github.com/spring-financial-group/ethereum-config-chains
    path: network-configs/private-net
    configName: devnet

devnet:
  enabled: true
  baseUrl: "https://raw.githubusercontent.com/spring-financial-group/ethereum-config-chains/main/network-configs"
  name: "private-net"

# P2P port for beacon bootnode
p2pPort: 9000

# Disable this to prevent $(POD_IP) from overriding enr-address
p2pNodePort:
  enabled: false

extraArgs:
  - --enr-address=10.0.43.50
  - --testnet-dir=/data/testnet_spec  # Tell bootnode to use your genesis

# Minimal resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Enable service for other beacons to reach it
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: p2p-tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: p2p-udp
      port: 9000
      targetPort: 9000
      protocol: UDP