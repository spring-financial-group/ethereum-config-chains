jwt: 0xfad2709d0bb03bf0e8ba3c99bea194575d3e98863133d1af638ed056d1d59345

p2pPort: 13001

replicas: 1

resources:
  requests:
    cpu: "3"
    memory: "4Gi"
  limits:
    cpu: "3"
    memory: "4Gi"

extraArgs:
  - --execution-endpoint=http://geth-devnet:8551
  - --accept-terms-of-use
  - --min-sync-peers=0
  - --no-discovery
  - --p2p-max-peers=0

  # We can't use this to sync as were trying to start 2 Beacon nodes with this config - one for each rogue
  # but we want them to start from the same state and starting one a little later wills top this
  # so we have a job that gets the states from the beacon node running and these two pick it up
  # - --checkpoint-sync-url=http://beacon-devnet-prysm:3500
  - --checkpoint-state=/checkpoint/state.ssz
  - --checkpoint-block=/checkpoint/block.ssz

extraVolumes:
  - name: checkpoint
    persistentVolumeClaim:
      claimName: checkpoint-data

extraVolumeMounts:
  - name: checkpoint
    mountPath: /checkpoint
    readOnly: true

devnet:
  enabled: true
  baseUrl: "https://raw.githubusercontent.com/spring-financial-group/ethereum-config-chains/main/network-configs"
  name: "private-net"