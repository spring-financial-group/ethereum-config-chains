extraArgs:
  - --beacon-nodes=http://beacon-devnet-lighthouse:5052
  - --datadir=/data
  - --suggested-fee-recipient=0x0000000000000000000000000000000000000001

extraVolumes:
  - name: validator-keystores
    secret:
      secretName: validator-keystores

extraVolumeMounts:
  - name: validator-keystores
    mountPath: /validator-keys
    readOnly: true

# If the chart doesn't have built-in init, add simple unpacker
initContainers:
  - name: unpack-keys
    image: busybox
    command:
      - sh
      - -c
      - |
        cd /data/validators
        tar -xzf /validator-keys/keystores.tar.gz
        # Lighthouse expects: /data/validators/<pubkey>/voting-keystore.json
        # and passwords in /data/secrets/<pubkey>
    volumeMounts:
      - name: storage
        mountPath: /data
      - name: validator-keystores
        mountPath: /validator-keys