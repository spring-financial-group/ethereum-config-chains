mode: "validator"

jwt: 0xfad2709d0bb03bf0e8ba3c99bea194575d3e98863133d1af638ed056d1d59345

p2pPort: 13002

resources:
  requests:
    cpu: "2"
    memory: "3Gi"
  limits:
    cpu: "2"
    memory: "3Gi"

devnet:
  enabled: true
  baseUrl: "https://raw.githubusercontent.com/spring-financial-group/ethereum-config-chains/main/network-configs"
  name: "private-net"

extraArgs:
  - --testnet-dir=/data/testnet_spec
  - --datadir=/imported-keys
  - --beacon-nodes=http://beacon-devnet-lighthouse:5052
  - --suggested-fee-recipient=0x3333333333333333333333333333333333333333
  - --graffiti=rogue-validator-2

replicas: 1

image:
  repository: sigp/lighthouse
  tag: latest

extraVolumes:
  - name: validator-keystores-rogue
    secret:
      secretName: validator-keystores-rogue
  - name: imported-keys
    emptyDir: {}

extraVolumeMounts:
  - name: validator-keystores-rogue
    mountPath: /secrets
    readOnly: true
  - name: imported-keys
    mountPath: /imported-keys

initContainers:
  - name: import-keys
    image: sigp/lighthouse:latest
    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /tmp/keystores
        cd /tmp/keystores
        tar -xzf /secrets/keystores.tar.gz

        echo "Unpacked keystores:"
        ls -la /tmp/keystores/
        
        imported=0
        for keystore in /tmp/keystores/*/keystore*.json; do
          if [ ! -f "$keystore" ]; then
            continue
          fi
        
          pubdir=$(dirname "$keystore")
          pub=$(basename "$pubdir")
        
          if [ -f "/secrets/${pub}.txt" ]; then
            passfile="/secrets/${pub}.txt"
          elif [ -f "/secrets/prysm-password.txt" ]; then
            passfile="/secrets/prysm-password.txt"
          elif [ -f "/secrets/password.txt" ]; then
            passfile="/secrets/password.txt"
          else
            echo "ERROR: No password file found for $pub"
            continue
          fi
        
          echo "Importing keystore for $pub..."
        
          lighthouse account validator import \
            --datadir=/imported-keys \
            --keystore="$keystore" \
            --password-file="$passfile" \
            --reuse-password || echo "Failed to import $pub"
        
          imported=$((imported + 1))
        done
        
        echo "Successfully imported $imported keystores"
        ls -laR /imported-keys/validators/

    volumeMounts:
      - name: validator-keystores-rogue
        mountPath: /secrets
        readOnly: true
      - name: imported-keys
        mountPath: /imported-keys

  - name: reset-slashing-db
    image: sigp/lighthouse:latest
    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
    command:
      - /bin/sh
      - -c
      - |
        echo "🔥 RESETTING LIGHTHOUSE SLASHING PROTECTION FOR DEMO 🔥"
        
        # Remove old slashing protection
        rm -f /imported-keys/validators/slashing_protection.sqlite
        rm -f /imported-keys/validators/slashing_protection.sqlite-shm
        rm -f /imported-keys/validators/slashing_protection.sqlite-wal
        
        # Create new empty slashing protection DB using Lighthouse
        # This initializes a fresh DB with no history
        lighthouse account validator slashing-protection \
          --datadir=/imported-keys \
          --testnet-dir=/data/testnet_spec \
          import /dev/null 2>/dev/null || echo "Creating fresh slashing DB"
        
        echo "Fresh slashing protection DB created - validator has no memory of past attestations"
        ls -la /imported-keys/validators/
    volumeMounts:
      - name: imported-keys
        mountPath: /imported-keys
      - name: storage
        mountPath: /data